services:
  api-1:
    build:
      context: .
      dockerfile: Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LOKI_URL: http://loki:3100
      SERVICE_NAME: api-1
      Search__ShardDatabasePaths__0: /data/database.db
    volumes:
      - search-data:/data

  api-2:
    build:
      context: .
      dockerfile: Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LOKI_URL: http://loki:3100
      SERVICE_NAME: api-2
      Search__ShardDatabasePaths__0: /data/database.db
    volumes:
      - search-data:/data

  gateway:
    build:
      context: .
      dockerfile: Gateway/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LOKI_URL: http://loki:3100
      SERVICE_NAME: gateway
    ports:
      - "5000:8080"
    depends_on:
      - api-1
      - api-2

  webapp:
    build:
      context: .
      dockerfile: WebApp/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      LOKI_URL: http://loki:3100
      SERVICE_NAME: webapp
      SEARCH_API_BASE_URL: http://gateway:8080/
    ports:
      - "5002:8080"
    depends_on:
      - gateway

  loki:
    image: grafana/loki:3.5.0
    command: -config.file=/etc/loki/config.yml
    ports:
      - "3100:3100"
    volumes:
      - ./observability/loki-config.yml:/etc/loki/config.yml:ro
      - loki-data:/loki

  grafana:
    image: grafana/grafana:12.1.0
    ports:
      - "3000:3000"
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./observability/grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - loki

volumes:
  search-data:
  loki-data:
  grafana-data:
